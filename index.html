  <div id="comments-section" data-page="/">
    <h3>Comments</h3>
    <div id="comments-list"></div>
    <form id="comment-form">
      <input id="comment-name" type="text" placeholder="Your name" required>
      <textarea id="comment-body" placeholder="Write a comment..." required></textarea>
      <button type="submit">Post Comment</button>
    </form>
  </div>
  <script>
const SUPABASE_URL = 'https://vppilausbmwpxivhpqbx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable__XSRBjLglB8qzilaPZS6zg_SBKqRDTx';
(function() {
  var section = document.getElementById('comments-section');
  var page = section ? section.getAttribute('data-page') : '/';
  async function loadComments() {
    try {
      var res = await fetch(
        SUPABASE_URL + '/rest/v1/comments?page=eq.' + encodeURIComponent(page) + '&order=created_at.desc',
        { headers: { apikey: SUPABASE_ANON_KEY } }
      );
      if (!res.ok) return;
      var comments = await res.json();
      var list = document.getElementById('comments-list');
      if (!list) return;
      if (comments.length === 0) {
        list.innerHTML = '<p class="no-comments">No comments yet.</p>';
        return;
      }
      list.innerHTML = comments.map(function(c) {
        return '<div class="comment">' +
          '<div class="comment-header">' +
            '<strong>' + esc(c.name) + '</strong>' +
            '<span class="comment-date">' + new Date(c.created_at).toLocaleDateString() + '</span>' +
          '</div>' +
          '<p>' + esc(c.body) + '</p>' +
        '</div>';
      }).join('');
    } catch (e) {}
  }
  async function submitComment(e) {
    e.preventDefault();
    var nameInput = document.getElementById('comment-name');
    var bodyInput = document.getElementById('comment-body');
    var name = nameInput.value.trim();
    var body = bodyInput.value.trim();
    if (!name || !body) return;
    var btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      await fetch(SUPABASE_URL + '/rest/v1/comments', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: SUPABASE_ANON_KEY,
          Prefer: 'return=representation'
        },
        body: JSON.stringify({ page: page, name: name, body: body })
      });
    } catch (e) {}
    nameInput.value = '';
    bodyInput.value = '';
    btn.disabled = false;
    loadComments();
  }
  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
  document.addEventListener('DOMContentLoaded', function() {
    var form = document.getElementById('comment-form');
    if (form) {
      form.addEventListener('submit', submitComment);
      loadComments();
    }
  });
})();
  </script>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }
    function toggleCategory(header) {
      header.classList.toggle('active');
      header.querySelector('.arrow').classList.toggle('open');
      header.nextElementSibling.classList.toggle('open');
    }
  </script>
  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      var b = document.body.classList.contains('dark-mode');
      try { localStorage.setItem('theme', b ? 'dark' : 'light'); } catch(e) {}
      document.querySelector('.theme-toggle').textContent = b ? '\uD83C\uDF19' : '\u2600\uFE0F';
    }
    (function() {
      var btn = document.querySelector('.theme-toggle');
      try {
        var saved = localStorage.getItem('theme');
        if (saved !== 'light') {
          document.body.classList.add('dark-mode');
          if (btn) btn.textContent = '\uD83C\uDF19';
        }
      } catch(e) {}
    })();
  </script>
